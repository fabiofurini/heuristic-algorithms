# mkdocs.yml (English): generated by python/genera_sito.py from python/mkdocs_modello_en.yml (LINGUA=en).
# Do not edit mkdocs.yml by hand.
site_name: Heuristic Algorithms · Fabio Furini
site_url: https://fabiofurini.github.io/heuristic-algorithms/
site_description: >-
  Lecture notes on heuristic algorithms for combinatorial optimization problems: primal and dual bounds, constructive heuristics, local search, metaheuristics and MIP heuristics, applied to knapsack, packing, routing, scheduling and coloring problems, with exercises, interactive apps and Colab notebooks.
site_author: Fabio Furini
repo_url: https://github.com/fabiofurini/heuristic-algorithms
copyright: >-
  &copy; 2026 Fabio Furini — text and figures licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/deed.en">CC BY 4.0</a>,
  code licensed under
  <a href="https://github.com/fabiofurini/heuristic-algorithms/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: en
  icon:
    logo: material/map-marker-path
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

# le pagine delle singole app non stanno nel menu: il laboratorio è una voce sola
not_in_nav: |
  /lab/*.md
  !/lab/index.md

plugins:
  - search:
      lang: en
  # old URLs of pages of these chapters (from Combinatorial Optimization Problems, without the part folder)
  - redirects:
      redirect_maps:
        # 2026-10-12: the KP is the «0/1 knapsack problem» (knapsack problems are the family)
        constructive-heuristics/the-knapsack-problem-which-order.md: constructive-heuristics/the-0-1-knapsack-problem-which-order.md
        # 2026-10-12: the code of the heuristics chapters is in the Colab notebooks
        constructive-heuristics/c-implementation.md: notebooks.md
        local-search/c-implementation.md: notebooks.md
        metaheuristics/c-implementation.md: notebooks.md

